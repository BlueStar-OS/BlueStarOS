[package]
name = "os"
version = "0.1.0"
authors = ["Dirinkbottle"]
edition = "2021"
description = "BlueStarOS - a RISC-V 64 kernel written in Rust"
license = "MIT"
repository = "https://github.com/inkbottle/BlueStarOS"
readme = "README.md"
keywords = ["kernel", "operating-system", "riscv"]
categories = ["os", "embedded"]

[features]
default = ["riscv64-qemu"]
main_fs = ["ext4"]
ext4 = ["rsext4"]

# Architecture capability features. Board features below select one of them.
riscv64 = []
aarch64 = []

# Optional AArch64 board driver capabilities. They are intentionally not part
# of the QEMU profile; enabling one belongs to a future RK3588 board profile.
rk3588-emmc = []

# Complete board profiles. Keep driver selection here so Cargo and Rust use
# the same source of truth.
riscv64-qemu = ["riscv64", "main_fs"]
spacemitk3-com260kit = ["riscv64", "main_fs"]
aarch64-qemu = ["aarch64", "main_fs"]

[dependencies]
log = "0.4"
bitflags = "^2.11.0"
buddy_system_allocator = "0.6"
lazy_static = { version="1.4.0", features = ["spin_no_std"] }
riscv = { path = "./dependencies/riscv", features = ["inline-asm"]}
xmas-elf = "0.7.0"
spin = "0.9"
virtio-drivers = {git = "https://github.com/rcore-os/virtio-drivers", rev = "4ee80e5"}
rsext4 = {path = "./dependencies/rsext4", optional = true}
paste = "1.0.15"

[profile.release]
debug = true
panic = "abort"

[profile.dev]
panic = "abort"
